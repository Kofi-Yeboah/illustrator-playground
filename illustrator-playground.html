<meta charset="utf-8">
<title>Illustrator Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-core.min.js"></script>
<style>
/* Layout: lesson brief on the left (site chrome, light/dark), a replica of Illustrator's Essentials workspace on the right (always Illustrator's own grey UI) */
:root{
  --bg:#f5f6f8; --surface:#fff; --surface-2:#eceef2; --line:#e0e3e9; --ink:#14161b; --ink-2:#474c58; --ink-3:#666c7a;
  --accent:#ff7a1a; --accent-ink:#b4500a; --accent-soft:#fff0e4; --good:#14ae5c; --good-ink:#0d7a40; --good-soft:#e2f6eb;
  --font-display:"Bricolage Grotesque", Geist, system-ui, sans-serif; --font-ui:Geist, system-ui, -apple-system, "Segoe UI", sans-serif; --font-mono:"Geist Mono", ui-monospace, Menlo, monospace;
  /* Illustrator UI (medium dark), identical in both site themes */
  --ai-frame:#3d3d3d; --ai-bar:#535353; --ai-panel:#535353; --ai-panel-2:#4a4a4a; --ai-field:#454545; --ai-line:#474747; --ai-line-2:#6a6a6a;
  --ai-ink:#ececec; --ai-ink-2:#c8c8c8; --ai-ink-3:#9a9a9a; --ai-paste:#606060; --ai-hi:#383838; --ai-sel:#4f80ff; --ai-blue:#1473e6;
  --ai-font:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f12; --surface:#16181c; --surface-2:#1f2127; --line:#2a2d35; --ink:#eceef2; --ink-2:#b1b6c2; --ink-3:#868c99;
  --accent-ink:#ffa25c; --accent-soft:#3a2310; --good-ink:#46d38e; --good-soft:#0f2b1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f12; --surface:#16181c; --surface-2:#1f2127; --line:#2a2d35; --ink:#eceef2; --ink-2:#b1b6c2; --ink-3:#868c99;
  --accent-ink:#ffa25c; --accent-soft:#3a2310; --good-ink:#46d38e; --good-soft:#0f2b1d; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-ui)}
button{font:inherit;color:inherit}
.page{height:100%;display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}

/* ---------- Brief (site chrome) ---------- */
.brief{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.nav{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font:800 15px var(--font-display)}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff;font:700 11px var(--font-ui);font-style:normal}
.brand small{margin-left:auto;font:500 11px var(--font-mono);color:var(--ink-3)}
.navrow{display:flex;gap:6px}
.navrow select{flex:1;min-width:0;font:500 13px var(--font-ui);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,select:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.brief-scroll{overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.eyebrow{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.brief h1{font:800 26px/1.1 var(--font-display);margin:2px 0 0;text-wrap:balance}
.method{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
kbd{font:500 11.5px var(--font-mono);background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink)}
.tabs{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.tabs button{flex:1;border:0;background:none;border-radius:7px;padding:5px 0;cursor:pointer;font-weight:500;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pane{display:grid;gap:12px}
.pane p{margin:0}
.pane h4{margin:0 0 6px;font:600 12px var(--font-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.pane ol{margin:0;padding-left:20px;display:grid;gap:6px}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.uses a{font-size:12.5px;text-decoration:none;color:var(--accent-ink);background:var(--accent-soft);padding:3px 9px;border-radius:99px}
.situation{font-weight:500}
.speed{display:flex;align-items:center;gap:2px;font-size:12.5px;color:var(--ink-3)}
.speed span{margin-right:6px}
.speed button{border:1px solid var(--line);background:var(--surface);padding:3px 8px;cursor:pointer;font:500 12px var(--font-mono);color:var(--ink-2)}
.speed button:first-of-type{border-radius:7px 0 0 7px}.speed button:last-of-type{border-radius:0 7px 7px 0}
.speed button+button{margin-left:-1px}
.speed button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);position:relative}
.speed button:focus-visible{outline:2px solid var(--accent-ink);outline-offset:1px;position:relative}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:9px;align-items:flex-start;color:var(--ink-2)}
.checks .tick{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:1px}
.checks li.ok{color:var(--ink)}
.checks li.ok .tick{background:var(--good);border-color:var(--good);position:relative}
.checks li.ok .tick::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.win{background:var(--good-soft);color:var(--good-ink);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.hint{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.muted{color:var(--ink-3);font-size:13px}

/* ---------- Illustrator replica ---------- */
.ai{position:relative;background:var(--ai-frame);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0;min-width:0;font:12px/1.3 var(--ai-font);color:var(--ai-ink);box-shadow:0 10px 40px rgba(0,0,0,.25);user-select:none;-webkit-user-select:none}
.ai button{background:none;border:0;cursor:default;padding:0}
.ai input{font:inherit;color:var(--ai-ink)}
.ai-appbar{height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--ai-frame);border-bottom:1px solid #2e2e2e;flex:none}
.lights{display:flex;gap:7px}.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.ai-appbar .title{flex:1;text-align:center;color:var(--ai-ink-2);font-size:12px}
.share{background:var(--ai-blue)!important;color:#fff;border-radius:12px!important;padding:3px 12px!important;font-weight:600}
.ico{width:18px;height:18px;display:inline-grid;place-items:center;color:var(--ai-ink-2)}
.ai-strip{height:12px;flex:none;background:var(--ai-frame);display:flex;justify-content:space-between;align-items:center;padding:0 4px;color:var(--ai-ink-3);font-size:9px;line-height:1}
.ai-doctabs{height:28px;display:flex;align-items:stretch;background:var(--ai-bar);padding-left:46px;flex:none;border-bottom:1px solid #3e3e3e}
.doctab{display:flex;align-items:center;gap:10px;padding:0 14px 0 10px;background:#3e3e3e;color:var(--ai-ink);font-size:11.5px;font-weight:600;white-space:nowrap}
.doctab b{font-weight:400;color:var(--ai-ink-3)}
.ai-body{flex:1;display:flex;min-height:0}
.ai-tools{width:46px;flex:none;background:var(--ai-bar);border-right:1px solid #3e3e3e;overflow-y:auto;overflow-x:hidden;padding:0 0 8px;scrollbar-width:none;display:flex;flex-direction:column;align-items:center}
.tgrip{height:16px;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 5px;color:var(--ai-ink-3);font-size:10px;line-height:1}
.tbtn{position:relative;display:grid;place-items:center;width:34px;height:27px;flex:none;border-radius:3px;color:var(--ai-ink)}
.tbtn:hover{background:#5e5e5e}
.tbtn[aria-pressed="true"]{background:var(--ai-hi)}
.tbtn.off{opacity:.45}
.tbtn.grp::after{content:"";position:absolute;right:3px;bottom:3px;border:2px solid transparent;border-right-color:currentColor;border-bottom-color:currentColor;opacity:.75}
.tbtn:focus-visible{outline:2px solid var(--ai-blue)}
.tbtn svg,.flyout svg,.dgrid svg{width:18px;height:18px}
.tgrid{display:grid;grid-template-columns:34px;row-gap:1px;column-gap:4px}
.ai-tools.two{width:80px}
.ai-tools.two .tgrid{grid-template-columns:34px 34px}
.ai-tools.two ~ .drawer{left:80px}
.tcol{color:var(--ai-ink-3)!important;font-size:10px;line-height:1;padding:2px!important}
.fsw{position:relative;width:42px;height:44px;flex:none;margin-top:10px}
.fsw .fs{position:absolute;width:27px;height:27px;border:1px solid #111;box-shadow:inset 0 0 0 1px #fff}
.fsw .f{left:0;top:0;z-index:2}
.fsw .s{left:14px;top:15px;background:transparent;box-shadow:inset 0 0 0 1px #fff,inset 0 0 0 7px var(--sc,#000),inset 0 0 0 8px #fff}
.fsw .s.none{box-shadow:inset 0 0 0 1px #fff}
.fsw .swap{position:absolute;right:-2px;top:-3px;width:14px;height:14px;color:var(--ai-ink-2)}
.fsw .swap svg{width:14px;height:14px}
.fsw .dflt{position:absolute;left:0;bottom:-1px;width:12px;height:12px}
.fsw .dflt i{position:absolute;width:7px;height:7px;border:1px solid #ddd;background:#111}
.fsw .dflt i:first-child{left:0;top:0;z-index:1;background:#fff;border-color:#111}
.fsw .dflt i:last-child{left:4px;top:4px}
.seg{display:flex;gap:2px;margin-top:8px;background:#444;border-radius:4px;padding:2px}
.seg i{width:13px;height:14px;display:grid;place-items:center;border-radius:2px}
.seg i.on{background:#2f2f2f}
.seg i b{width:9px;height:9px;border:1px solid #111;display:block}
.seg.modes i{color:var(--ai-ink-2)}
.seg.modes svg{width:11px;height:11px}
.ai-tools.two .seg i{width:20px;height:18px}.ai-tools.two .seg i b{width:13px;height:13px}.ai-tools.two .fsw{transform:scale(1.35);transform-origin:top center;margin-bottom:16px}
.none{background:#fff linear-gradient(to top right,transparent calc(50% - 1px),#e00 calc(50% - 1px),#e00 calc(50% + 1px),transparent calc(50% + 1px))!important}
.tdots{color:var(--ai-ink-2);font-weight:700;letter-spacing:1px;margin-top:8px}
.drawer{position:absolute;left:46px;top:0;bottom:0;width:296px;background:var(--ai-bar);border-right:1px solid #2e2e2e;box-shadow:8px 0 18px rgba(0,0,0,.35);z-index:25;display:flex;flex-direction:column}
.drawer-h{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;font-weight:600}
.drawer-h .vt{display:flex;gap:2px;margin-left:16px}.drawer-h .vt span{width:22px;height:20px;display:grid;place-items:center;border-radius:3px;color:var(--ai-ink-2)}.drawer-h .vt span:last-child{background:var(--ai-hi);color:var(--ai-ink)}
.drawer-b{overflow:auto;flex:1;padding:0 8px 12px}
.drawer h6{margin:14px 0 8px;font-size:11.5px;font-weight:600;color:var(--ai-ink)}
.dgrid{display:grid;grid-template-columns:repeat(5,44px);gap:6px}
.dgrid button{height:36px;display:grid;place-items:center;border:1px solid #4a4a4a!important;border-radius:2px!important;color:var(--ai-ink-3)}
.dgrid button.inbar{color:var(--ai-ink-3)} .dgrid button.work{color:var(--ai-ink)}
.dgrid button:hover{background:#5e5e5e!important}
.drawer-f{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px;border-top:1px solid #4a4a4a;color:var(--ai-ink-2)}
.drawer-f i{width:20px;height:20px;border:1px solid #1d1d1d;background:#3a3a3a}
.ai-body{position:relative}
.ai-stage{flex:1;position:relative;min-width:0;background:var(--ai-paste);overflow:hidden}
.vscroll{position:absolute;right:0;top:0;bottom:0;width:12px;background:#585858;border-left:1px solid #4e4e4e}
.vscroll::after{content:"";position:absolute;left:3px;right:3px;top:44%;height:26px;border-radius:6px;background:#6e6e6e}
.ai-stage canvas{position:absolute;inset:0;display:block;touch-action:none}
.ai-dock{width:30px;flex:none;background:var(--ai-bar);border-left:1px solid #2e2e2e;display:flex;flex-direction:column;align-items:center;padding-top:8px}
.ai-panel{width:258px;flex:none;background:var(--ai-panel);border-left:1px solid #2e2e2e;display:flex;flex-direction:column;min-height:0;position:relative}
.ai-ptabs{display:flex;background:var(--ai-bar);height:26px;align-items:flex-end;padding-left:6px;flex:none}
.ai-ptabs button{height:24px;padding:0 10px;color:var(--ai-ink-3);font-weight:600;border-radius:3px 3px 0 0}
.ai-ptabs button[aria-selected="true"]{background:var(--ai-panel);color:var(--ai-ink)}
.ai-pbody{overflow:auto;flex:1;padding-bottom:12px}
.psec{border-bottom:1px solid var(--ai-line);padding:10px 12px 12px;display:grid;gap:8px}
.psec h5{margin:0;font-size:12px;font-weight:500;color:var(--ai-ink-2)}
.ptype{padding:10px 12px;border-bottom:1px solid var(--ai-line);font-size:11.5px;color:var(--ai-ink-2)}
.fgrid{display:grid;grid-template-columns:24px 1fr 1fr 22px;gap:6px 8px;align-items:center}
.fld{display:flex;align-items:center;gap:5px;color:var(--ai-ink-2)}
.fld input{width:100%;min-width:0;background:var(--ai-field);border:1px solid var(--ai-line);border-radius:3px;padding:3px 5px;font-size:11.5px}
.fld input:focus{outline:1px solid var(--ai-blue);border-color:var(--ai-blue)}
.refpt{display:grid;grid-template-columns:repeat(3,5px);gap:2px}
.refpt i{width:5px;height:5px;border:1px solid var(--ai-ink-3)}
.refpt i:nth-child(5){background:var(--ai-ink)}
.pbtn{display:inline-grid;place-items:center;width:26px;height:24px;border-radius:3px;color:var(--ai-ink-2)}
.pbtn:hover{background:#5f5f5f}
.pbtn[aria-pressed="true"]{background:var(--ai-hi);color:var(--ai-ink)}
.prow{display:flex;align-items:center;gap:8px}
.chip{width:18px;height:18px;border:1px solid #1d1d1d;border-radius:2px;flex:none;cursor:default}
.chip.stroke{background:var(--ai-panel)!important;box-shadow:inset 0 0 0 4px var(--c,#000)}
.chip.stroke.none{box-shadow:none}
.lbl{color:var(--ai-ink);min-width:44px}
.lbl.u{text-decoration:underline dotted;text-underline-offset:3px}
.num{width:58px!important}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qa button,.wide{border:1px solid var(--ai-line-2)!important;border-radius:4px!important;padding:5px 6px!important;color:var(--ai-ink);text-align:center;font-size:11.5px}
.qa button:hover,.wide:hover{background:#5f5f5f!important}
.more{justify-self:end;color:var(--ai-ink-3);letter-spacing:1px;font-weight:700}
.iconrow{display:flex;gap:2px;flex-wrap:wrap}
.layers{display:grid}
.lrow{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-bottom:1px solid var(--ai-line);font-size:11.5px}
.lrow.top{background:var(--ai-panel-2);font-weight:600}
.lrow .eye{width:16px;color:var(--ai-ink-2)}
.lrow .bar{width:3px;height:16px;background:var(--ai-sel)}
.lrow .thumb{width:20px;height:16px;background:#fff;border:1px solid #2e2e2e}
.lrow .tgt{margin-left:auto;width:12px;height:12px;border-radius:50%;border:1px solid var(--ai-ink-3)}
.lrow .sq{width:7px;height:7px;background:var(--ai-sel)}
.lrow.sel{background:#5d5d5d}
.swpop{position:absolute;right:8px;width:236px;background:#4a4a4a;border:1px solid #2a2a2a;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.4);padding:8px;z-index:20}
.swpop .swh{display:flex;justify-content:space-between;color:var(--ai-ink-2);margin-bottom:6px}
.swgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.swgrid button{aspect-ratio:1;border:1px solid #2a2a2a!important;border-radius:1px}
.swgrid button:hover{outline:1px solid #fff}
.ai-help{height:24px;flex:none;display:flex;align-items:center;gap:7px;padding:0 10px;background:var(--ai-bar);border-top:1px solid #2e2e2e;color:var(--ai-ink-2);font-size:11.5px;white-space:nowrap;overflow:hidden}
.ai-help .q{width:14px;height:14px;border-radius:50%;background:var(--ai-ink-3);color:var(--ai-bar);display:grid;place-items:center;font-weight:700;font-size:10px;flex:none}
.ai-status{height:24px;flex:none;display:flex;align-items:center;gap:12px;padding:0 10px 0 50px;background:var(--ai-bar);color:var(--ai-ink-2);font-size:11px;white-space:nowrap;overflow:hidden;border-top:1px solid #4a4a4a}
.ai-status .box{display:inline-flex;justify-content:space-between;gap:10px;background:var(--ai-field);border:1px solid #3e3e3e;border-radius:2px;padding:1px 4px 1px 6px;min-width:62px;color:var(--ai-ink)}
.ai-status .box::after{content:"⌄";color:var(--ai-ink-3)}
.ai-status .nav{display:inline-flex;align-items:center;gap:7px;color:var(--ai-ink-3)}
.ai-status .nav .box{min-width:46px}
.ai-help b{color:var(--ai-ink);font-weight:600}
.ai-help .sep{color:var(--ai-ink-3);margin:0 6px}
.nosel{padding:10px 12px;color:var(--ai-ink-2);border-bottom:1px solid var(--ai-line);font-size:11.5px}
.pline{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px}
.pline .l{color:var(--ai-ink-2);font-size:11.5px;text-align:right}
.pline .l.left{text-align:left}
.dd{display:flex;justify-content:space-between;align-items:center;background:var(--ai-field);border:1px solid #3e3e3e;border-radius:3px;padding:3px 6px;font-size:11.5px}
.dd::after{content:"⌄";color:var(--ai-ink-3)}
.cb{display:flex;align-items:center;gap:7px;color:var(--ai-ink-2);font-size:11.5px}
.cb i{width:11px;height:11px;border:1px solid var(--ai-ink-3);border-radius:2px}
.psec h5.row2{display:flex;justify-content:space-between;align-items:center}
.demo{position:absolute;inset:0;z-index:50;cursor:progress}
.demo-cur{position:absolute;left:0;top:0;width:24px;height:24px;background-repeat:no-repeat;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.demo-key{position:absolute;left:0;top:0;display:flex;align-items:center;gap:3px;pointer-events:none;white-space:nowrap}
.demo-key kbd{background:#fff;color:#111;border:1px solid #999;border-bottom-width:3px;border-radius:5px;padding:2px 7px;font:700 12px var(--ai-font);box-shadow:0 3px 10px rgba(0,0,0,.35)}
.demo-key .plus{color:#fff;font-weight:700;text-shadow:0 1px 2px #000}
.demo-ring{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid #ff7a1a;opacity:0;pointer-events:none}
.demo-ring.on{animation:ring .5s ease-out}
@keyframes ring{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.6)}}
.demo-say{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;max-width:min(560px,90%);background:rgba(24,24,24,.92);color:#fff;padding:9px 14px;border-radius:9px;font:500 13px/1.35 var(--ai-font);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.demo-say .caps{display:flex;align-items:center;gap:4px;flex:none}
.demo-say kbd{background:#f2f2f2;color:#111;border:1px solid #bbb;border-bottom-width:3px;border-radius:5px;padding:2px 7px;font:600 12px var(--ai-font)}
.demo-say .plus{color:#aaa}
@media (prefers-reduced-motion:reduce){.demo-ring.on{animation:none}}
